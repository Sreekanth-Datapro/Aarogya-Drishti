<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#167c55" />
    <meta name="robots" content="noindex" />
    <title>Offline — Aarogya Drishti</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #167c55;
        --bg: #f5f8f6;
        --text: #0f172a;
        --muted: #475569;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(22, 124, 85, 0.12), transparent 40%),
          var(--bg);
        color: var(--text);
      }
      main {
        width: min(440px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        color: var(--brand);
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        margin-top: 8px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Aarogya Drishti needs an internet connection for live patient data,
        clinical actions, reports and sign-in.
      </p>
      <p>
        The application shell may still open, but patient records and API
        actions are not available offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
